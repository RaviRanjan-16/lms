<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #CDE8E5;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .card {
            background:#7AB2B2;
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }

        .header-bg {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
        }

        .footer-bg {
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }

        .btn-custom {
            background: #4D869C;
            border: none;
            color: white;
            font-size: 16px;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
        }

        .btn-custom:hover {
            background: #ff3b2f;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg header-bg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">Library Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/admin/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Welcome Message -->
    <div class="container mt-4 text-center">
        <h2>Welcome, <span th:text="${session.adminName}"></span>!</h2>
    </div>

    <!-- Dashboard Cards Section -->
    <div class="container mt-4">
        <div class="row">
            <!-- Total Books -->
            <div class="col-md-3 mb-3">
                <div class="card text-white">
                    <div class="card-body">
                        <h4>Total Books</h4>
                        <p th:text="${totalBooks} ?: '0'">0</p>
                    </div>
                </div>
            </div>

            <!-- Total Categories -->
            <div class="col-md-3 mb-3">
                <div class="card text-white">
                    <div class="card-body">
                        <h4>Total Categories</h4>
                        <p id="totalCategories">0</p>
                    </div>
                </div>
            </div>

            <!-- Issued Books -->
            <div class="col-md-3 mb-3">
                <div class="card text-white">
                    <div class="card-body">
                        <h4>Issued Books</h4>
                        <p id="issuedBooks">0</p>
                    </div>
                </div>
            </div>

            <!-- Available Books -->
            <div class="col-md-3 mb-3">
                <div class="card text-white">
                    <div class="card-body">
                        <h4>Available Books</h4>
                        <p id="${totalCopiesAvailable} ?: '0'">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Manage Sections -->
        <div class="section-title">Manage Library</div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <h5>Add New Book</h5>
                    <button class="btn btn-custom" onclick="location.href='/books/add'">Go</button>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <h5>Issue Books</h5>
                    <button class="btn btn-custom" onclick="location.href='/issuebooks/issue'">Go</button>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <h5>Add Student</h5>
                    <button class="btn btn-custom" onclick="location.href='/admin/users/register'">ADD</button>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card text-center">
                    <h5>Manage Student</h5>
                    <button class="btn btn-custom" onclick="location.href='/categories'">Manage</button>
                </div>
            </div>
        </div>

        <!-- Statistics -->
       

    <!-- Footer -->
    <footer class="footer-bg text-white">
        <p>Contact Us: support@library.com | +91 9876543210</p>
        <p>&copy; 2025 Library Management System. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
   
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
