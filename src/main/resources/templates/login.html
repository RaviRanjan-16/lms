<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Library Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #CDE8E5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .login-container {
            background: #7AB2B2;
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-control {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-login {
            background: #4D869C;
            border: none;
            color: white;
            font-size: 16px;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
        }

        .btn-login:hover {
            background: #ff3b2f;
        }

        .error-message {
            color: #ff3b2f;
            margin-bottom: 10px;
        }

        .alert-success {
            background: rgba(0, 255, 0, 0.2);
            border: none;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Admin Login</h2>

        <!-- Display Error Message -->
        <p th:if="${error}" class="error-message" th:text="${error}"></p>
        <div th:if="${logoutmsg}" class="alert alert-success text-center">
            <p th:text="${logoutmsg}"></p>
        </div>

        <!-- Login Form -->
        <form action="/admin/login" method="post">
            <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
            <input type="password" name="password" class="form-control" placeholder="Enter Password" minlength="8" required>
            <button type="submit" class="btn btn-login">Login</button>
        </form>
    </div>

</body>
</html>
