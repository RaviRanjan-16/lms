<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Full Page Background */
        body {
            background: linear-gradient(to right, #3D52A0, #6A9C89);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            background-color:rgba(0, 0, 0, 0.8);
            position: absolute;
            top: 0;
            left: 0;
            padding: 15px;
        }

        .navbar-nav {
            margin-left: auto;
        }

        /* Hero Section */
        .hero-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 15px;
            width: 80%;
            max-width: 700px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            animation: fadeIn 2s ease-in-out;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Buttons */
        .btn-primary, .btn-outline-light {
            padding: 12px 24px;
            font-size: 1.2rem;
            margin: 10px;
            transition: 0.3s ease;
            border-radius: 5px;
            border: none;
        }

        .btn-primary {
            background: #7091E6;
        }

        .btn-primary:hover {
            background: #8697E4;
        }

        .btn-outline-light {
            background: transparent;
            border: 2px solid white;
            color: white;
        }

        .btn-outline-light:hover {
            background: white;
            color: #3D52A0;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color:rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 15px 0;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark p-3">
        <div class="container d-flex">
        	<img th:src="@{/logo.png}" alt="Logo" class="rounded-circle" width="40" height="40">
            <h3 class="navbar-brand fw-bold" >Library Management</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link text-light" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="/about">About Us</a></li>
                    
                    <li class="nav-item"><a class="nav-link text-light" href="/admin/loginAdmin">Admin Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1>Library Management System</h1>
        <p>"A reader lives a thousand lives before he dies." - George R.R. Martin</p>
        <a href="/admin/loginAdmin" class="btn btn-primary">🔑 Admin Login</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Library Management System. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
