<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #CDE8E5;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .card {
            background:#7AB2B2;
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.5);
            color: white;
        }

        .btn-custom {
            background: #4D869C;
            border: none;
            color: white;
            font-size: 16px;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
        }

        .btn-custom:hover {
            background: #ff3b2f;
        }

        .header-bg {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
        }

        .footer-bg {
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg header-bg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">Library Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="books.html">Books</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="categories.html">Categories</a></li>
                   
                </ul>
            </div>
        </div>
    </nav>

    <!-- Add Book Form -->
    <div th:if="${addbookmsg}" class="alert alert-success text-center">
            <p th:text="${addbookmsg}"></p>
        </div>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card text-center">
                    <h3 class="mb-4">Add New Book</h3>
                    <form action="/books/save" method="post">
                        
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" placeholder="Enter book title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Author</label>
                            <input type="text" name="author" class="form-control" placeholder="Enter author name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" placeholder="Enter book category" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Number of Copies Available</label>
                            <input type="number" name="availableCopies" class="form-control" placeholder="Enter available copies" required>
                        </div>
                        <button type="submit" class="btn btn-custom">Add Book</button>
                    </form>
                   
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-bg text-white">
        <p>&copy; 2025 Library Management System. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
