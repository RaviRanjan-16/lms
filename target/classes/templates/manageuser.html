<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #CDE8E5;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-bg {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
        }
        .btn-custom {
            background: #4D869C;
            border: none;
            color: white;
            font-size: 16px;
            padding: 5px;
            width: 10%;
            border-radius: 10px;
        }
        
         .footer-bg {
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }
</style>
</head>


<body>
    <nav class="navbar navbar-expand-lg header-bg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">Library Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/admin/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <table style="color: black" >
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.email}"></td>
                <td>
                <div class="d-flex gap-2">
                    <form th:action="@{/students/update}" method="post">
                        <input type="hidden" name="id" th:value="${student.id}" />
                        <input type="text" name="email" th:value="${student.email}" />
                        <button type="submit" class="btn btn-warning btn-sm">Update</button>
                    </form>
                    <form th:action="@{/students/delete}" method="post">
                        <input type="hidden" name="id" th:value="${student.id}" />
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                 </div>
                    
                </td>
            </tr>
        </tbody>
    </table>
     <footer class="footer-bg text-white">
        <p>&copy; 2025 Library Management System. All Rights Reserved.</p>
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
