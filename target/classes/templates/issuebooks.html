<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<style>
 body {
            background: #CDE8E5;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
.btn-custom {
            background: #4D869C;
            border: none;
            color: white;
            font-size: 16px;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
        }

        .btn-custom:hover {
            background: #ff3b2f;
        }
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Library Management</a>
    </div>
</nav>

<div class="container my-5">
    <h2 class="text-center">Issue a Book</h2>
    
    <!-- Issue Book Form -->
    <form action="/issuebooks/issue" method="post">
        <div class="mb-3">
            <label for="userEmail" class="form-label">User Email</label>
            <select id="userEmail" name="userEmail" class="form-control" required>
                <option value="">Select User</option>
                <th:block th:each="user : ${users}">
                    <option th:value="${user.email}" th:text="${user.email}"></option>
                </th:block>
            </select>
        </div>

        <div class="mb-3">
            <label for="bookId" class="form-label">Book</label>
            <select id="bookId" name="bookId" class="form-control" required>
                <option value="">Select Book</option>
                <option th:each="book : ${books}" th:value="${book.id}" th:text="${book.title + 'by' + book.author}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-custom">Issue Book</button>
    </form>

    <h3 class="mt-5">Issued Books</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Book</th>
                <th>User</th>
                <th>Issued Date</th>
                <th>Return Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="issue : ${issued}">
                <td th:text="${issue.book.title}"></td>
                <td th:text="${issue.user.email}"></td>
                <td th:text="${issue.issueDate}"></td>
                <td>
                    <span th:if="${issue.issuedStatus}" class="text-success">Returned</span>
                    <span th:unless="${issue.issuedStatus}" class="text-danger">Not Returned</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Library Management. All Rights Reserved.</p>
</footer>

</body>
</html>
