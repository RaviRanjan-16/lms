<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Books</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
body {
	background: #CDE8E5;
	color: white;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

.btn-custom {
	background: #4D869C;
	border: none;
	color: white;
	font-size: 16px;
	padding: 10px;
	width: 100%;
	border-radius: 5px;
}

.btn-custom:hover {
	background: #ff3b2f;
}
</style>
</head>
<body>


	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<header class="header d-flex pe-1">
				<img th:src="@{/logo.png}" alt="Logo" width="40" height="40">
				<h2>Library Management System</h2>
			</header>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
					<li class="nav-item"><a class="nav-link text-white"
						href="/dashboard">Dashborad</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container my-5">
		<h2 class="text-center">Issue a Book</h2>

		<!-- Issue Book Form -->
		<form action="/issuebooks/issue" method="post">
			<div class="mb-3">
				<label for="userEmail" class="form-label">User Email</label> <select
					id="userEmail" name="userEmail" class="form-control" required>
					<option value="">Select User</option>
					<th:block th:each="user : ${users}">
						<option th:value="${user.email}" th:text="${user.email}"></option>
					</th:block>
				</select>
			</div>

			<div class="mb-3">
				<label for="bookId" class="form-label">Book</label> <select
					id="bookId" name="bookId" class="form-control" required>
					<option value="">Select Book</option>
					<option th:each="book : ${books}" th:value="${book.id}"
						th:text="${book.title + ' by  ' + book.author}"></option>
				</select>
			</div>

			<button type="submit" class="btn btn-custom">Issue Book</button>
		</form>

		<h3 class="mt-5">Issued Books</h3>
		<table class="table table-striped">
			<thead>
				<tr>
					<th>Book</th>
					<th>User</th>
					<th>Issued Date</th>
					<th>Return Status</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="issue : ${issued}">
					<td th:text="${issue.book.title}"></td>
					<td th:text="${issue.user.email}"></td>
					<td th:text="${issue.issueDate}"></td>
					<td><span th:if="${issue.issuedStatus}" class="text-success">Returned</span>
						<span th:unless="${issue.issuedStatus}" class="text-danger">Not
							Returned</span></td>
					<td>
					<form th:action="@{'/issuebooks/return/' + ${issue.id}}" method="post">
    <button class="btn btn-warning" type="submit">Return</button>
</form>
					
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<footer class="bg-dark text-white text-center py-3">
		<p>&copy; 2025 Library Management. All Rights Reserved.</p>
	</footer>
	
	<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
